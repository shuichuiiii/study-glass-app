name: Build proxyless 3-tab ARM64 preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-flclash-arm64-reference.yml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Study Glass UI (proxy backend omitted)
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify the three-tab UI and build ARM64 APK
        run: |
          grep -q "LearningPage()" lib/main.dart
          grep -q "VocabularyPage()" lib/main.dart
          grep -q "SettingsPage(" lib/main.dart
          flutter build apk --release --target-platform android-arm64

      - name: Upload proxyless ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: study-glass-proxyless-3tabs-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
