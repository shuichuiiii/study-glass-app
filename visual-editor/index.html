<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10111a"><title>Flutter 可视化编辑器</title>
<style>
:root{color-scheme:dark;--bg:#10111a;--panel:#191b28;--line:#303346;--text:#f3f4ff;--muted:#a5a8c2;--accent:#a9a4ff;--surface:#25283a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}button.primary{background:var(--accent);color:#171528;border-color:transparent;font-weight:700}button.active{outline:2px solid var(--accent)}header{position:sticky;top:0;z-index:5;background:#10111aee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:16px;margin:0}header small{color:var(--muted)}.actions{display:flex;gap:6px}.actions button{padding:8px 10px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(220px,280px) minmax(260px,1fr) minmax(220px,300px);gap:12px;padding:12px;max-width:1500px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}.panel h2{font-size:14px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.components{display:grid;grid-template-columns:1fr 1fr;gap:8px}.components button{min-height:66px;text-align:left}.components b{display:block;font-size:14px}.components span{font-size:11px;color:var(--muted)}.workspace{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}.toolbar{display:flex;gap:7px;flex-wrap:wrap;width:100%;justify-content:center}.device{width:min(100%,380px);height:690px;max-height:calc(100dvh - 150px);min-height:500px;border:7px solid #343646;border-radius:38px;background:#0e1018;overflow:hidden;box-shadow:0 24px 70px #0008;position:relative}.status{height:28px;display:flex;justify-content:space-between;padding:5px 20px;font-size:11px;color:#d9dcf5}.screen{height:calc(100% - 28px);overflow:auto;padding:18px 16px 90px;background:var(--screenbg,#11131d);color:var(--screenfg,#f4f4ff)}.screen-title{font-size:25px;font-weight:750;margin:4px 0 6px}.screen-subtitle{color:#aeb2cc;font-size:13px;margin-bottom:18px}.preview-card{background:var(--cardbg,#222638);border:1px solid #ffffff17;border-radius:var(--radius,18px);padding:14px;margin:10px 0;position:relative;touch-action:manipulation}.preview-card.selected{outline:2px solid var(--accent);outline-offset:1px}.preview-card .component-label{font-size:10px;color:#aaaed0;letter-spacing:.04em;margin-bottom:6px}.preview-card h3{font-size:16px;margin:0 0 5px}.preview-card p{font-size:13px;margin:0;color:#c1c5dc}.preview-button{background:var(--accent);color:#19172d;border:0;border-radius:12px;padding:11px 15px;font-weight:700}.preview-input{width:100%;background:#141725;border:1px solid #444861;border-radius:10px;padding:11px;color:#fff}.nav-preview{position:absolute;bottom:13px;left:15px;right:15px;background:#e5e6f21f;backdrop-filter:blur(20px);border:1px solid #ffffff2a;border-radius:24px;padding:12px;display:flex;justify-content:space-around;color:#e4e4ff;font-size:12px}.field{margin:13px 0}.field label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:7px}.field input[type=range]{width:100%;accent-color:var(--accent)}.field input[type=text],.field select{width:100%;padding:10px;background:#11131d;color:var(--text);border:1px solid var(--line);border-radius:10px}.field input[type=color]{width:100%;height:40px;background:transparent;border:0}.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.empty{border:1px dashed #484b65;border-radius:14px;padding:15px;color:var(--muted);font-size:12px}.bottom-tabs{display:none}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e6e3ff;color:#19172d;padding:10px 16px;border-radius:12px;z-index:20;display:none;max-width:90vw}.toast.show{display:block}@media(max-width:900px){.layout{grid-template-columns:1fr;max-width:600px;padding:9px}.workspace{order:0}.left-panel{order:1}.right-panel{order:2}.device{height:610px;max-height:70dvh}.panel{padding:13px}.components{grid-template-columns:repeat(3,1fr)}.components button{padding:9px 6px;min-height:60px}.components span{display:none}header small{display:none}.actions button{font-size:12px;padding:8px}.bottom-tabs{display:flex;position:sticky;bottom:0;background:#10111af0;padding:8px;gap:6px;border-top:1px solid var(--line);z-index:6}.bottom-tabs button{flex:1;font-size:12px}.layout[data-tab="design"] .workspace,.layout[data-tab="design"] .right-panel{display:none}.layout[data-tab="props"] .workspace,.layout[data-tab="props"] .left-panel{display:none}.layout[data-tab="preview"] .left-panel,.layout[data-tab="preview"] .right-panel{display:none}.layout[data-tab="preview"] .workspace{display:flex}}@media(min-width:901px){.bottom-tabs{display:none}}
</style></head>
<body>
<header><div><h1>◈ Flutter 可视化编辑器</h1><small>手机优先 · 拖选组件 · 实时预览</small></div><div class="actions"><button id="newBtn">重置</button><button id="exportBtn" class="primary">导出</button></div></header>
<main class="layout" id="layout" data-tab="preview">
<section class="panel left-panel"><h2>组件库</h2><p class="muted">点击添加到画布，点选画布组件可编辑属性。</p><div class="components">
<button data-add="text"><b> T 文本</b><span>标题与说明</span></button><button data-add="card"><b>▣ 卡片</b><span>内容容器</span></button><button data-add="button"><b>● 按钮</b><span>操作按钮</span></button><button data-add="input"><b>▤ 输入框</b><span>文本输入</span></button><button data-add="image"><b>▧ 图片占位</b><span>图片区域</span></button><button data-add="spacer"><b>↕ 间距</b><span>垂直留白</span></button><button data-add="divider"><b>— 分割线</b><span>内容分隔</span></button><button data-add="stat"><b>◉ 数据卡</b><span>数字与标签</span></button><button data-add="nav"><b>⌘ 底部导航</b><span>导航栏</span></button>
</div><div style="margin-top:14px"><h2>页面结构</h2><div id="tree" class="empty">正在加载组件…</div></div></section>
<section class="workspace"><div class="toolbar"><button id="upBtn">↑ 上移</button><button id="downBtn">↓ 下移</button><button id="duplicateBtn">复制</button><button id="deleteBtn">删除</button></div>
<div class="device"><div class="status"><span>9:41</span><span>● ● ▰</span></div><div class="screen" id="screen"></div><div class="nav-preview" id="navPreview"><span>⌂ 首页</span><span>▤ 发现</span><span>◉ 我的</span></div></div><p class="muted">当前为交互式预览；选中组件后可在属性面板修改。</p></section>
<section class="panel right-panel"><h2>属性面板</h2><div id="props"><div class="empty">先点击画布上的一个组件。</div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>页面主题</h2>
<div class="field"><label>强调色</label><input id="accent" type="color" value="#a9a4ff"></div><div class="field"><label>页面背景</label><input id="bgColor" type="color" value="#11131d"></div><div class="field"><label>卡片圆角 <span id="radiusVal">18 px</span></label><input id="radius" type="range" min="0" max="36" value="18"></div><div class="field"><label>页面边距 <span id="paddingVal">16 px</span></label><input id="padding" type="range" min="8" max="32" value="16"></div><div class="field"><label>整体文字大小 <span id="fontVal">14 px</span></label><input id="fontSize" type="range" min="12" max="22" value="14"></div><button id="saveBtn" class="primary" style="width:100%">保存到此设备</button><p class="muted">保存内容只存于当前浏览器。导出功能生成设计 JSON 与 Flutter Dart 初始布局代码。</p></section>
</main>
<nav class="bottom-tabs"><button data-tab="design">组件</button><button data-tab="preview">预览</button><button data-tab="props">属性</button></nav><div class="toast" id="toast"></div>
<script>
const defaults=[{type:'text',title:'你好，学习者',body:'今天也向目标前进一步。',size:25},{type:'stat',title:'连续学习',body:'7 天',size:22},{type:'card',title:'今日学习计划',body:'单词复习 · 15 分钟',size:16},{type:'button',title:'开始学习',body:'',size:14},{type:'nav',title:'首页 / 发现 / 我的',body:'',size:14}];
let items=defaults.map((x,i)=>({...x,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),radius:18,padding:14,color:'#a9a4ff'})),selected=items[0]?.id;
let theme={accent:'#a9a4ff',background:'#11131d',radius:18,padding:16,fontSize:14};
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const screen=$('screen');screen.style.setProperty('--screenbg',theme.background);screen.style.setProperty('--radius',theme.radius+'px');screen.style.setProperty('--accent',theme.accent);screen.style.padding= '18px '+theme.padding+'px 90px';screen.style.fontSize=theme.fontSize+'px';$('navPreview').style.display=items.some(x=>x.type==='nav')?'flex':'none';screen.innerHTML=items.filter(x=>x.type!=='nav').map(x=>{let inner='';if(x.type==='text')inner='<div class="component-label">TEXT</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p>';else if(x.type==='card')inner='<div class="component-label">CARD</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p>';else if(x.type==='button')inner='<button class="preview-button" style="font-size:'+x.size+'px">'+esc(x.title)+'</button>';else if(x.type==='input')inner='<input class="preview-input" placeholder="'+esc(x.title)+'">';else if(x.type==='image')inner='<div style="height:110px;border-radius:12px;background:linear-gradient(135deg,#555b7c,#25283a);display:grid;place-items:center;color:#d5d6e9">▧ 图片占位</div><p>'+esc(x.title)+'</p>';else if(x.type==='spacer')inner='<div style="height:'+Math.max(12,x.size*2)+'px;display:grid;place-items:center;color:#888ba4">间距 '+Math.max(12,x.size*2)+'px</div>';else if(x.type==='divider')inner='<hr style="border:0;border-top:1px solid #ffffff30">';else if(x.type==='stat')inner='<div class="component-label">STATISTIC</div><p>'+esc(x.title)+'</p><h3 style="font-size:'+x.size+'px">'+esc(x.body)+'</h3>';return '<div class="preview-card '+(x.id===selected?'selected':'')+'" data-id="'+x.id+'" style="border-radius:'+x.radius+'px;padding:'+x.padding+'px">'+inner+'</div>'}).join('');screen.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{selected=el.dataset.id;render();renderProps()}));renderTree();}
function renderTree(){const t=$('tree');t.className='';t.innerHTML=items.map((x,i)=>'<button data-tree="'+x.id+'" style="display:flex;width:100%;justify-content:space-between;margin:5px 0;text-align:left;'+(x.id===selected?'border-color:var(--accent);':'')+'"><span>'+(i+1)+'. '+esc(({text:'文本',card:'卡片',button:'按钮',input:'输入框',image:'图片占位',spacer:'间距',divider:'分割线',stat:'数据卡',nav:'底部导航'})[x.type])+' · '+esc(x.title||'未命名')+'</span><span>›</span></button>').join('')||'<div class="empty">画布为空，请从组件库添加组件。</div>';t.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>{selected=b.dataset.tree;render();renderProps()});}
function renderProps(){const p=$('props'),x=items.find(x=>x.id===selected);if(!x){p.innerHTML='<div class="empty">先选择一个组件。</div>';return;}p.innerHTML='<div class="muted">组件类型：'+x.type+'</div><div class="field"><label>显示文字 / 标题</label><input type="text" id="propTitle" value="'+esc(x.title)+'"></div><div class="field"><label>说明文字 / 内容</label><input type="text" id="propBody" value="'+esc(x.body)+'"></div><div class="field"><label>字号 <span id="sizeVal">'+x.size+' px</span></label><input id="propSize" type="range" min="10" max="32" value="'+x.size+'"></div><div class="field"><label>组件圆角 <span id="compRadiusVal">'+x.radius+' px</span></label><input id="propRadius" type="range" min="0" max="36" value="'+x.radius+'"></div><div class="field"><label>内边距 <span id="compPaddingVal">'+x.padding+' px</span></label><input id="propPadding" type="range" min="0" max="32" value="'+x.padding+'"></div><div class="field"><label>强调颜色</label><input id="propColor" type="color" value="'+x.color+'"></div>';
$('propTitle').oninput=e=>{x.title=e.target.value;render();};$('propBody').oninput=e=>{x.body=e.target.value;render()};$('propSize').oninput=e=>{x.size=+e.target.value;$('sizeVal').textContent=x.size+' px';render()};$('propRadius').oninput=e=>{x.radius=+e.target.value;$('compRadiusVal').textContent=x.radius+' px';render()};$('propPadding').oninput=e=>{x.padding=+e.target.value;$('compPaddingVal').textContent=x.padding+' px';render()};$('propColor').oninput=e=>{x.color=e.target.value;theme.accent=e.target.value;$('accent').value=theme.accent;render()};}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const type=b.dataset.add;const names={text:'新文本',card:'新卡片',button:'新按钮',input:'请输入内容',image:'图片标题',spacer:'间距',divider:'分割线',stat:'学习进度',nav:'首页 / 发现 / 我的'};const x={type,title:names[type],body:type==='text'?'在这里输入说明文字':type==='stat'?'80%':type==='card'?'卡片说明':'',size:type==='text'?18:14,radius:18,padding:14,color:theme.accent,id:crypto.randomUUID?crypto.randomUUID():String(Date.now())};items.push(x);selected=x.id;render();renderProps();if(innerWidth<900)$('layout').dataset.tab='preview';});
$('accent').oninput=e=>{theme.accent=e.target.value;render()};$('bgColor').oninput=e=>{theme.background=e.target.value;render()};$('radius').oninput=e=>{theme.radius=+e.target.value;$('radiusVal').textContent=theme.radius+' px';render()};$('padding').oninput=e=>{theme.padding=+e.target.value;$('paddingVal').textContent=theme.padding+' px';render()};$('fontSize').oninput=e=>{theme.fontSize=+e.target.value;$('fontVal').textContent=theme.fontSize+' px';render()};
$('deleteBtn').onclick=()=>{items=items.filter(x=>x.id!==selected);selected=items[0]?.id;render();renderProps()};$('duplicateBtn').onclick=()=>{const x=items.find(x=>x.id===selected);if(x){const y={...x,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:x.title+' 副本'};items.splice(items.indexOf(x)+1,0,y);selected=y.id;render();renderProps()}};$('upBtn').onclick=()=>move(-1);$('downBtn').onclick=()=>move(1);function move(d){const i=items.findIndex(x=>x.id===selected),j=i+d;if(i<0||j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];render();renderProps()}
function snapshot(){return {format:'flutter-visual-editor-v1',theme,components:items.map(({id,...x})=>x)}}
function dart(){const children=items.map(x=>{if(x.type==='text')return 'Text('+JSON.stringify(x.title)+', style: const TextStyle(fontSize: '+x.size+')),\n'+(x.body?'Text('+JSON.stringify(x.body)+'),\n':'');if(x.type==='button')return 'FilledButton(onPressed: () {}, child: Text('+JSON.stringify(x.title)+')),\n';if(x.type==='divider')return 'const Divider(),\n';if(x.type==='spacer')return 'SizedBox(height: '+Math.max(12,x.size*2)+'),\n';if(x.type==='input')return 'TextField(decoration: InputDecoration(hintText: '+JSON.stringify(x.title)+')),\n';if(x.type==='nav')return '// 底部导航组件：'+x.title+'\n';if(x.type==='image')return 'Container(height: 110, alignment: Alignment.center, child: const Text("图片占位")),\n';if(x.type==='stat')return 'Card(child: Padding(padding: EdgeInsets.all('+x.padding+'), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('+JSON.stringify(x.title)+'), Text('+JSON.stringify(x.body)+', style: TextStyle(fontSize: '+x.size+'))]))),\n';return 'Card(child: Padding(padding: EdgeInsets.all('+x.padding+'), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('+JSON.stringify(x.title)+'), Text('+JSON.stringify(x.body)+')]))),\n';}).join('');return "import 'package:flutter/material.dart';\n\nclass GeneratedPage extends StatelessWidget {\n  const GeneratedPage({super.key});\n  @override\n  Widget build(BuildContext context) => Scaffold(\n    backgroundColor: const Color(0xFF"+theme.background.slice(1).toUpperCase()+"),\n    body: SafeArea(child: SingleChildScrollView(padding: EdgeInsets.all("+theme.padding+"), child: Column(crossAxisAlignment: CrossAxisAlignment.stretch, children: [\n"+children+"    ]))),\n  );\n}\n"}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exportBtn').onclick=()=>{download('flutter-design.json',JSON.stringify(snapshot(),null,2),'application/json');download('generated_page.dart',dart(),'text/plain');toast('已导出 JSON 设计稿和 Flutter Dart 初始代码')};$('saveBtn').onclick=()=>{localStorage.setItem('flutterVisualEditor',JSON.stringify({items,selected,theme}));toast('设计已保存到当前浏览器')};$('newBtn').onclick=()=>{if(confirm('重置画布？未保存的更改将丢失。')){items=defaults.map((x,i)=>({...x,id:String(Date.now()+i),radius:18,padding:14,color:theme.accent}));selected=items[0].id;theme={accent:'#a9a4ff',background:'#11131d',radius:18,padding:16,fontSize:14};syncTheme();render();renderProps()}};function syncTheme(){$('accent').value=theme.accent;$('bgColor').value=theme.background;$('radius').value=theme.radius;$('radiusVal').textContent=theme.radius+' px';$('padding').value=theme.padding;$('paddingVal').textContent=theme.padding+' px';$('fontSize').value=theme.fontSize;$('fontVal').textContent=theme.fontSize+' px'}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.tab)$('layout').dataset.tab=b.dataset.tab}));try{const saved=JSON.parse(localStorage.getItem('flutterVisualEditor'));if(saved?.items?.length){items=saved.items;selected=saved.selected;theme={...theme,...saved.theme};syncTheme()}}catch(e){}render();renderProps();
</script></body></html>
